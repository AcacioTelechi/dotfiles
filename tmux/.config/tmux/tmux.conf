# ~/.config/tmux/tmux.conf  —  managed via GNU Stow (dotfiles/tmux)

# --- Prefix: Ctrl-b -> Ctrl-a (easier to reach) ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Colors: true-color (24-bit) so oh-my-posh / nvim render correctly ---
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
set -ga terminal-overrides ",*256col*:Tc"

# --- Neovim-friendly ---
set -sg escape-time 10        # no lag on <Esc> in nvim
set -g focus-events on        # let nvim autoread/autosave on focus

# --- Quality of life ---
set -g mouse on
set -g history-limit 50000
set -g base-index 1           # windows start at 1
setw -g pane-base-index 1     # panes start at 1
set -g renumber-windows on    # keep window numbers gap-free
set -g set-clipboard on
setw -g automatic-rename off  # keep manual window names (don't track running app)

# --- Splits keep current path; intuitive keys ---
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- Reload config: prefix r ---
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# --- Vi-style copy mode ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection

# Copy straight to the system clipboard — OSC 52 through Ghostty was
# unreliable, so bypass it. Picks the right tool per OS at config-load:
#   macOS  -> pbcopy
#   Wayland -> wl-copy
#   X11    -> xclip
run-shell 'tmux set -g @copy-cmd "$( \
  if   command -v pbcopy >/dev/null 2>&1;       then echo pbcopy; \
  elif [ "$XDG_SESSION_TYPE" = "wayland" ];     then echo wl-copy; \
  else echo "xclip -in -selection clipboard"; fi)"'

bind -T copy-mode-vi y                 send -X copy-pipe-and-cancel "#{@copy-cmd}"
bind -T copy-mode-vi Enter             send -X copy-pipe-and-cancel "#{@copy-cmd}"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "#{@copy-cmd}"

# --- Plugins (tpm) -------------------------------------------------------
# First install: prefix + I   |   Update: prefix + U   |   Remove: prefix + alt+u
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'           # color theme (pinned tag)
set -g @plugin 'christoomey/vim-tmux-navigator'   # C-h/j/k/l across tmux+nvim
set -g @plugin 'tmux-plugins/tmux-resurrect'      # prefix+C-s save / prefix+C-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'      # auto-save + auto-restore on start
set -g @plugin 'tmux-plugins/tmux-cpu'            # feeds @catppuccin_status_cpu / _ram
set -g @continuum-restore 'on'

# --- Catppuccin theme (v2 API) ------------------------------------------
# v2 doesn't auto-fill the status bar; compose it from modules below.
set -g @catppuccin_flavor 'mocha'                 # latte | frappe | macchiato | mocha
set -g @catppuccin_window_status_style 'rounded'

# Show the window name (#W) instead of the pane/app title (catppuccin default #T)
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# Status bar: session on the left, app + date/time on the right.
# #{E:...} forces re-evaluation each redraw, so the catppuccin vars (set
# when tpm sources the plugin on the line below) resolve correctly.
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ' #{E:@catppuccin_status_session}'
set -g status-right '#{E:@catppuccin_status_application}'
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -g @catppuccin_date_time_text ' %a %d-%b %H:%M '

# Keep this line LAST in the file (tpm sources every @plugin above — no
# manual `run` lines needed; those caused the "returned 127" errors):
run '~/.config/tmux/plugins/tpm/tpm'
